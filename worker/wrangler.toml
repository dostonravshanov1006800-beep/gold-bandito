name = "gold-bandito"
main = "src/index.js"
compatibility_date = "2025-09-01"

# База D1: создай через `wrangler d1 create gold-bandito`
# и вставь сюда database_id из вывода команды.
[[d1_databases]]
binding = "DB"
database_name = "gold-bandito"
database_id = "623042e1-480b-4378-9765-c4a03d89c312"

[vars]
# URL мини-аппа на GitHub Pages
WEBAPP_URL = "https://dostonravshanov1006800-beep.github.io/gold-bandito/"
# Origins, которым разрешено вызывать API (через запятую; для локальной отладки — localhost)
ALLOWED_ORIGINS = "https://dostonravshanov1006800-beep.github.io,http://localhost:8000,http://localhost:5500"

# Секреты (НЕ коммитить, задаются: `wrangler secret put ИМЯ`):
#   BOT_TOKEN     — токен @masons_agent
#   ADMIN_IDS     — Telegram ID админов через запятую
#   WEBHOOK_SECRET — случайная строка для проверки webhook

[triggers]
# Самопроверка вебхука каждый час (автовосстановление)
crons = ["0 * * * *"]
