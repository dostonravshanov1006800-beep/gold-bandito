name: Deploy worker

# Деплой Cloudflare Worker при пуше в main (если заданы секреты
# CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID). Без них тихо пропускается.

on:
  push:
    branches: [main]
    paths: ['worker/**', 'worker/*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Проверка секретов Cloudflare
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Секреты Cloudflare не заданы — деплой пропущен (см. README, раздел Worker)."
          fi
      - name: Deploy
        if: steps.check.outputs.have == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save wrangler
          npx wrangler deploy
